<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4e5f">
<meta name="apple-mobile-web-app-title" content="Quedaneitor">
<meta name="mobile-web-app-capable" content="yes">
<title>El Quedaneitor</title>
<style>
:root{--bg:#f7f7f3;--fg:#1d2b30;--mut:#6b7780;--card:#fff;--line:#dfe3e6;--acc:#1f4e5f;--acct:#fff;--g1:#1e7b34;--g1t:#fff;--g2:#c6efce;--g2t:#0b5a1e;--am:#ffeb9c;--amt:#6b5200;--wk:#eef3fa;--bad:#fdecea;--badt:#8a1f17}
@media (prefers-color-scheme:dark){:root{--bg:#14191b;--fg:#e8eef0;--mut:#93a1a8;--card:#1d2528;--line:#33403f;--acc:#6fb3c8;--acct:#0f1b1f;--g1:#3fae5a;--g1t:#06210e;--g2:#1f4a2a;--g2t:#b9f0c6;--am:#4d4219;--amt:#ffe9a0;--wk:#222d33;--bad:#3a1f1c;--badt:#ffb4ab}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:26px;margin:4px 0 2px;color:var(--acc)}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.hint{font-size:14px;color:var(--mut);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px}
.tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-weight:600;padding:9px;border-radius:9px;cursor:pointer}
.tabs button.on{background:var(--acc);color:var(--acct)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
.chip.ok{border-color:var(--g1)}
.btn{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:10px;padding:9px 13px;background:var(--acc);color:var(--acct);cursor:pointer;text-decoration:none;display:inline-block}
.btn.sec{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
textarea,input.code{width:100%;font:13px/1.3 ui-monospace,Menlo,Consolas,monospace;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
textarea{min-height:90px;resize:vertical}
.month{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:12px}
.month h2{font-size:15px;letter-spacing:.04em;text-transform:uppercase;margin:2px 4px 8px;color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{font-size:12px;font-weight:700;text-align:center;color:var(--mut)}
.d{aspect-ratio:1/1;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--fg);font:inherit;font-size:15px;font-weight:600;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.d.we{background:var(--wk)}
.d small{font-size:11px;font-weight:700}
.d.sel{outline:2px solid var(--acc);outline-offset:1px}
.d.mine,.d.all{background:var(--g1);color:var(--g1t);border-color:var(--g1)}
.d.one{background:var(--g2);color:var(--g2t);border-color:var(--g2)}
.d.two{background:var(--am);color:var(--amt);border-color:var(--am)}
.empty{visibility:hidden}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;margin-bottom:12px}
.legend span{padding:3px 9px;border-radius:99px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer;align-items:flex-start}
.row:first-of-type{border-top:0}
.row b{text-transform:capitalize}
.tag{border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700;text-align:right}
.tag.ok{background:var(--g1);color:var(--g1t)}
.tag.no{background:var(--bad);color:var(--badt)}
.kv{display:flex;gap:10px;padding:5px 0;font-size:14px}.kv b{min-width:110px}
label.sw{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:10px}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.ptabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:9px 15px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.ptabs button.on{background:var(--acc);color:var(--acct);border-color:var(--acc)}
.ptabs button.star{border-color:var(--g1)}
.sync{font-size:12px;color:var(--mut);margin:0 0 10px}
.nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;align-items:center;background:var(--bg);padding:8px 0;margin:0 0 6px;border-bottom:1px solid var(--line)}
.nav select{flex:1;min-width:0;font:inherit;font-weight:600;font-size:15px;padding:9px 8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);text-transform:capitalize}
.nav .btn{padding:9px 12px;font-size:16px;line-height:1}
.nav .btn:disabled{opacity:.35;cursor:default}
.month{scroll-margin-top:64px}
.yr{font-size:22px;font-weight:800;color:var(--acc);margin:18px 4px 8px}
.d.past{opacity:.35;cursor:default;background:var(--card)!important;color:var(--mut)!important;border-color:var(--line)!important;text-decoration:line-through}
.d.today{box-shadow:inset 0 -3px 0 var(--acc)}
/* Móvil primero */
html{-webkit-text-size-adjust:100%}
button,select,label,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{-webkit-user-select:none;user-select:none}
.btn,.chip,.ptabs button,.tabs button{min-height:44px}
.btn:active,.ptabs button:active,.d:active,.row:active{transform:scale(.95)}
.btn.warn{background:var(--bad);color:var(--badt);border-color:var(--badt)}
.row2 .btn{flex:1 1 auto}
.ptabs{scrollbar-width:none;-webkit-overflow-scrolling:touch}.ptabs::-webkit-scrollbar{display:none}
.nav{top:env(safe-area-inset-top,0px)}
.nav select{font-size:16px;min-height:44px}
.nav .btn{min-width:44px}
label.sw{min-height:44px}label.sw input{width:22px;height:22px}
.row{width:100%;background:none;border:0;border-top:1px solid var(--line);color:inherit;font:inherit;font-size:14px;text-align:left;min-height:44px}
.card .row:first-of-type{border-top:0}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18);animation:sh-up .18s ease-out}
#sheet[hidden]{display:none}
@keyframes sh-up{from{transform:translateY(100%)}}
.sh-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.sh-top h3{margin:0;font-size:17px;text-transform:capitalize}
body.sheet-on main{padding-bottom:230px}
body.sheet-on #qd-btn{display:none}
@media (max-width:420px){main{padding:12px 10px 110px}.grid{gap:3px}.d{font-size:16px;border-radius:8px}h1{font-size:23px}.nav .btn[data-a="hoy"]{padding:9px 10px}}
@media (prefers-reduced-motion:reduce){#sheet{animation:none}.btn:active,.ptabs button:active,.d:active,.row:active{transform:none}}
</style></head>
<body><main>
<h1>📅 El Quedaneitor</h1>
<p class="sub" id="sub">Entra en tu nombre, marca los días en que SÍ puedes y mira el día perfecto en ⭐.</p>
<div id="app"></div>
</main>
<div id="sheet" role="dialog" aria-live="polite" hidden></div>
<script>
/* Los días se guardan en una hoja de Google Sheets (mediante Google Apps Script) y se comparten entre todos los dispositivos.
   ▼▼▼ PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE APPS SCRIPT (termina en /exec) ▼▼▼ */
const SHEETS_URL="https://script.google.com/macros/s/AKfycbz3cRHYqDmX-643JWnrNDRGZ_Gcui2nqCfAMI56qougUnOUn5kqRwyGXm5dCXnqpsyG/exec";
const CONFIGURED=/^https:\/\/script\.google\.com\/macros\/s\/[^\s]+\/exec$/.test(SHEETS_URL);

/* Periodo del calendario: empieza en el mes actual (nunca antes de noviembre 2026)
   y siempre muestra 3 años por delante. Los meses nuevos aparecen solos. */
const NOW=new Date(),SPAN=37;
const FIRST=NOW.getFullYear()*12+NOW.getMonth()<2026*12+10?[2026,11]:[NOW.getFullYear(),NOW.getMonth()+1];
const LAST=(t=>[Math.floor(t/12),t%12+1])(FIRST[0]*12+FIRST[1]-1+SPAN);
const NAMES=["Luz","Sofía","Ari","More","Dani"],START=Date.UTC(FIRST[0],FIRST[1]-1,1),NDAYS=Math.round((Date.UTC(LAST[0],LAST[1],1)-START)/864e5);
const MN=["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const MONTHS=[];for(let y=FIRST[0],m=FIRST[1];y<LAST[0]||(y===LAST[0]&&m<=LAST[1]);m++){if(m>12){m=1;y++;if(y>LAST[0]||(y===LAST[0]&&m>LAST[1]))break}MONTHS.push([y,m])}
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,"0"),iso=(y,m,d)=>y+"-"+pad(m)+"-"+pad(d);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parse=k=>k.split("-").map(Number);
const label=k=>{const [y,m,d]=parse(k);return new Date(y,m-1,d).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})};
/* Días pasados: se ven en gris, no se pueden tocar y no cuentan para el ⭐ */
const today=()=>{const n=new Date();return iso(n.getFullYear(),n.getMonth()+1,n.getDate())};
const future=a=>{const t=today();return [...a].filter(k=>k>=t)};
const isSS=k=>{const [y,m,d]=parse(k);const w=new Date(y,m-1,d).getDay();return w===0||w===6};
const isWE=k=>{const [y,m,d]=parse(k);const w=new Date(y,m-1,d).getDay();return w===0||w===5||w===6};
const keyAt=i=>{const t=new Date(START+i*864e5);return iso(t.getUTCFullYear(),t.getUTCMonth()+1,t.getUTCDate())};
const ALL=[...Array(NDAYS).keys()].map(keyAt);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

let data={};NAMES.forEach(n=>data[n]=new Set());
try{const j=JSON.parse(ls.get("qd_data")||"{}");NAMES.forEach(n=>{if(Array.isArray(j[n]))data[n]=new Set(future(j[n]))})}catch(e){}
let cur=0,armed=false,armT=null,tab=ls.get("qd_tab")||"g",sel=null,onlyWE=false,sync="load",pending=null,saveT=null,last="";
const dump=()=>JSON.stringify(NAMES.map(n=>[...data[n]].sort()));

const dirty=new Set(),ver={};let pushedAt=0;
/* Comunicación con Google Sheets. El POST va como texto plano para evitar problemas de CORS. */
async function api(method,body){
  const r=await fetch(SHEETS_URL+(method==="GET"?"?t="+Date.now():""),
    method==="GET"?{cache:"no-store"}:{method:"POST",body:JSON.stringify(body)});
  if(!r.ok)throw new Error("http "+r.status);
  const j=await r.json();if(!j||!j.ok)throw new Error("api");return j;
}
async function push(n){
  const v=ver[n]||0;
  try{await api("POST",{name:n,dates:[...data[n]].sort()});if((ver[n]||0)===v)dirty.delete(n);pushedAt=Date.now();return true}
  catch(e){return false}
}
async function pull(){
  if(!CONFIGURED){sync="cfg"}
  else{
    const started=Date.now();
    try{
      /* Si algún cambio no llegó a subirse, se reintenta antes de leer */
      for(const n of [...dirty])if(n!==pending)await push(n);
      const j=(await api("GET")).data||{};
      if(pushedAt<=started){ /* si se guardó algo mientras leíamos, esta lectura ya puede estar vieja */
        NAMES.forEach(n=>{
          if(!dirty.has(n)&&n!==pending&&Array.isArray(j[n]))data[n]=new Set(future(j[n]));
          else data[n]=new Set(future(data[n]));
        });
      }
      sync=dirty.size?"err":"ok";
    }catch(e){sync="err"}
  }
  ls.set("qd_data",JSON.stringify(Object.fromEntries(NAMES.map(n=>[n,[...data[n]]]))));
  const d=dump()+sync;if(d!==last)render();
}
function persist(n,quiet){
  ls.set("qd_data",JSON.stringify(Object.fromEntries(NAMES.map(x=>[x,[...data[x]]]))));
  dirty.add(n);ver[n]=(ver[n]||0)+1;pending=n;clearTimeout(saveT);
  saveT=setTimeout(async()=>{
    if(!CONFIGURED)sync="cfg";
    else{const ok=await push(n);sync=ok&&!dirty.size?"ok":"err"}
    pending=null;if(!quiet||last!==dump()+sync)render();
  },400);
}

function stats(){
  const resp=NAMES.filter(n=>data[n].size>0),c={};
  resp.forEach(n=>data[n].forEach(k=>(c[k]=c[k]||[]).push(n)));
  return {resp,R:resp.length,c,cant:k=>resp.filter(n=>!data[n].has(k)),sinResp:NAMES.filter(n=>!resp.includes(n))};
}
function render(){
  const app=$("#app"),keep=scrollY;last=dump()+sync;
  const {resp,R,c,cant,sinResp}=stats();
  const g=tab==="g";let h="";
  h+=`<div class="ptabs">${NAMES.map(n=>`<button data-t="${esc(n)}" class="${tab===n?"on":""}">${data[n].size?"✅ ":""}${esc(n)}</button>`).join("")}<button data-t="g" class="star ${g?"on":""}">⭐ Día perfecto</button></div>`;
  h+=`<p class="sync">${sync==="ok"?"🟢 Compartido en vivo (Google Sheets)":sync==="err"?"🔴 Sin conexión con Google Sheets (se guarda en este dispositivo y se reintenta solo)":sync==="cfg"?"⚠️ Falta configurar la URL de Google Sheets: por ahora solo se guarda en este dispositivo":sync==="load"?"⏳ Conectando…":""}</p>`;
  if(!g){
    h+=`<p class="hint">Calendario de <b>${esc(tab)}</b>: toca los días en que SÍ puede. Se guarda solo. Marcados: <b id="cnt">${data[tab].size}</b>.</p>
    <div class="row2"><button class="btn sec" data-a="all">Seleccionar todo</button><button class="btn sec" data-a="wk">Solo findes</button><button class="btn sec${armed?" warn":""}" data-a="clr">${armed?"¿Seguro? Toca otra vez":"Borrar todo"}</button></div>`;
  }else{
    h+=`<p class="hint">Han marcado días: ${NAMES.map(n=>(resp.includes(n)?"✅ ":"⏳ ")+esc(n)).join(" · ")}</p>
    <div class="legend"><span style="background:var(--g1);color:var(--g1t)">Todas</span><span style="background:var(--g2);color:var(--g2t)">Falta 1</span><span style="background:var(--am);color:var(--amt)">Faltan 2</span></div>
    <label class="sw"><input type="checkbox" id="we" ${onlyWE?"checked":""}> Solo viernes, sábado y domingo</label>`;
    const best=Object.keys(c).filter(k=>R>0&&c[k].length>=R-1&&(!onlyWE||isWE(k))).sort((a,b)=>c[b].length-c[a].length||a.localeCompare(b)).slice(0,12);
    h+=`<div class="card"><h3>⭐ Mejores días</h3>`;
    if(!best.length)h+=`<p class="hint" style="margin:0">Todavía no hay días en que coincidáis${sinResp.length?" (faltan por marcar: "+sinResp.map(esc).join(", ")+")":""}.</p>`;
    best.forEach(k=>{const x=cant(k);
      h+=`<button class="row" data-d="${k}"><b>${label(k)}</b>${x.length?`<span class="tag no">No puede: ${x.map(esc).join(", ")}</span>`:`<span class="tag ok">${sinResp.length?"Las "+R+" que han marcado":"Todas"}</span>`}</button>`});
    h+=`</div><p class="hint">Toca un día del calendario para ver quién puede.</p>`;
  }
  const [cy,cm]=MONTHS[cur],years=[...new Set(MONTHS.map(x=>x[0]))];
  h+=`<div class="nav"><button class="btn sec" data-a="prev" aria-label="Mes anterior" ${cur?"":"disabled"}>‹</button>
    <select id="selm" aria-label="Mes">${MN.map((x,i)=>`<option value="${i+1}" ${i+1===cm?"selected":""} ${mIdx(cy,i+1)<0?"disabled":""}>${x}</option>`).join("")}</select>
    <select id="sely" aria-label="Año">${years.map(y=>`<option ${y===cy?"selected":""}>${y}</option>`).join("")}</select>
    <button class="btn sec" data-a="next" aria-label="Mes siguiente" ${cur<MONTHS.length-1?"":"disabled"}>›</button>
    <button class="btn sec" data-a="hoy">Hoy</button></div>`;
  const tk=today();
  MONTHS.forEach(([y,m],i)=>{
    const first=(new Date(y,m-1,1).getDay()+6)%7,n=new Date(y,m,0).getDate();
    if(i===0||m===1)h+=`<div class="yr">${y}</div>`;
    h+=`<section class="month" id="m${i}"><h2>${MN[m-1]} ${y}</h2><div class="grid">`+["L","M","X","J","V","S","D"].map(x=>`<div class="wd">${x}</div>`).join("");
    for(let i=0;i<first;i++)h+=`<div class="empty"></div>`;
    for(let d=1;d<=n;d++){
      const k=iso(y,m,d);let cls="d"+(((first+d-1)%7)>=5?" we":"")+(k===tk?" today":""),sub="";
      if(k<tk){h+=`<button class="${cls} past" disabled aria-label="${label(k)} (pasado)">${d}</button>`;continue}
      if(!g){if(data[tab].has(k))cls+=" mine"}
      else{const q=(c[k]||[]).length;
        if(R&&q>=R)cls+=" all";else if(R>1&&q===R-1&&q>0)cls+=" one";else if(R>2&&q===R-2&&q>0)cls+=" two";
        if(q)sub=`<small>${q}</small>`;if(sel===k)cls+=" sel"}
      h+=`<button class="${cls}" data-d="${k}" aria-label="${label(k)}">${d}${sub}</button>`}
    h+=`</div></section>`});
  app.innerHTML=h;scrollTo(0,keep);
  renderSheet();
}
/* Ficha del día (⭐): panel fijo abajo, siempre visible en el móvil */
function renderSheet(){
  const sh=$("#sheet"),open=tab==="g"&&!!sel;
  document.body.classList.toggle("sheet-on",open);
  if(!open){sh.hidden=true;sh.innerHTML="";return}
  const {c,cant,sinResp}=stats(),y=c[sel]||[],no=cant(sel);
  sh.hidden=false;
  sh.innerHTML=`<div class="sh-top"><h3>${label(sel)}</h3><button class="btn sec" data-a="close" aria-label="Cerrar">✕</button></div>
    <div class="kv"><b>✅ Pueden</b><span>${y.length?y.map(esc).join(", "):"Nadie aún"}</span></div>
    <div class="kv"><b>❌ No pueden</b><span>${no.length?no.map(esc).join(", "):"Nadie"}</span></div>
    ${sinResp.length?`<div class="kv"><b>⏳ Sin marcar</b><span>${sinResp.map(esc).join(", ")}</span></div>`:""}`;
}
function setTab(t){tab=t;ls.set("qd_tab",tab);sel=null;armed=false;render();scrollTo(0,0)}
/* Un solo listener para todo: más rápido en móvil que miles de onclick */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-t],[data-a],[data-d]");if(!t||t.disabled)return;
  if(t.dataset.t){setTab(t.dataset.t);return}
  const a=t.dataset.a;
  if(a==="prev")return go(cur-1);
  if(a==="next")return go(cur+1);
  if(a==="hoy"){const n=new Date();return go(Math.max(0,mIdx(n.getFullYear(),n.getMonth()+1)))}
  if(a==="close"){sel=null;render();return}
  if(a==="all"){future(ALL).forEach(k=>data[tab].add(k));persist(tab);render();return}
  if(a==="wk"){future(ALL).filter(isSS).forEach(k=>data[tab].add(k));persist(tab);render();return}
  if(a==="clr"){
    if(armed){armed=false;clearTimeout(armT);data[tab]=new Set();persist(tab)}
    else{armed=true;armT=setTimeout(()=>{armed=false;render()},3500)}
    render();return}
  const k=t.dataset.d;if(!k)return;
  if(tab!=="g"){
    /* Marcar/desmarcar sin redibujar todo el calendario: respuesta instantánea */
    const s=data[tab],on=!s.has(k);on?s.add(k):s.delete(k);
    t.classList.toggle("mine",on);
    if(navigator.vibrate)navigator.vibrate(8);
    $("#cnt").textContent=s.size;
    const tb=$(`.ptabs [data-t="${CSS.escape(tab)}"]`);if(tb)tb.textContent=(s.size?"✅ ":"")+tab;
    last=dump()+sync;persist(tab,true);return}
  sel=(sel===k&&!t.classList.contains("row"))?null:k;
  const old=$(".d.sel");if(old)old.classList.remove("sel");
  if(sel){const b=$(`.d[data-d="${sel}"]`);if(b)b.classList.add("sel")}
  renderSheet();
});
document.addEventListener("change",e=>{
  const [cy,cm]=MONTHS[cur];
  if(e.target.id==="we"){onlyWE=e.target.checked;render()}
  else if(e.target.id==="selm")go(mIdx(cy,+e.target.value));
  else if(e.target.id==="sely"){const y=+e.target.value;let i=mIdx(y,cm);if(i<0)i=MONTHS.findIndex(x=>x[0]===y);go(i)}
});
function mIdx(y,m){return MONTHS.findIndex(x=>x[0]===y&&x[1]===m)}
function go(i){if(i<0||i>=MONTHS.length)return;cur=i;render();const el=$("#m"+i);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
function track(){
  let i=0;const top=($(".nav")?.getBoundingClientRect().bottom||0)+20;
  document.querySelectorAll(".month").forEach((el,j)=>{if(el.getBoundingClientRect().top<=top)i=j});
  if(i===cur)return;cur=i;const [y,m]=MONTHS[i];
  $("#sely").value=y;$("#selm").value=m;
  $("#selm").querySelectorAll("option").forEach(o=>o.disabled=mIdx(y,+o.value)<0);
  const pv=$('[data-a="prev"]'),nx=$('[data-a="next"]');if(pv)pv.disabled=i===0;if(nx)nx.disabled=i===MONTHS.length-1;
}
let trackT=0;addEventListener("scroll",()=>{cancelAnimationFrame(trackT);trackT=requestAnimationFrame(track)},{passive:true});
$("#sub").textContent="De "+MN[FIRST[1]-1]+" de "+FIRST[0]+" a "+MN[LAST[1]-1]+" de "+LAST[0]+". Entra en tu nombre, marca los días en que SÍ puedes y mira el día perfecto en ⭐.";
render();pull();
setInterval(()=>{if(!document.hidden&&!pending)pull()},10000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!pending)pull()});
</script>

<style>

  width:86px;height:86px;border-radius:50%;border:5px solid #f5c400;cursor:pointer;color:#fff;font:800 11px/1.15 Arial,sans-serif;letter-spacing:.04em;

  animation:qd-pulse 1.6s ease-in-out infinite;-webkit-tap-highlight-color:transparent}

@keyframes qd-pulse{50%{box-shadow:0 6px 0 #5a0000,0 0 0 4px #1a1a1a,0 0 30px 10px rgba(255,40,40,.85)}}

  font-family:Arial,sans-serif;background:rgba(90,0,0,.78);animation:qd-alarm .5s steps(2) infinite;overflow:hidden;padding:20px}

#qd-ov::before{top:0}#qd-ov::after{bottom:0}
#qd-ov canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#qd-t1{font-weight:800;font-size:clamp(18px,5vw,28px);letter-spacing:.12em;text-shadow:0 0 12px #f00}
#qd-num{font-weight:900;font-size:clamp(110px,34vw,220px);line-height:1;text-shadow:0 0 30px #ff3b30,0 0 70px #f00;animation:qd-thump 1s ease-out infinite}
@keyframes qd-thump{0%{transform:scale(1.35);opacity:.4}25%{transform:scale(1);opacity:1}}

#qd-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
#qd-flash.go{animation:qd-flash 1.1s ease-out forwards}
@keyframes qd-flash{0%{opacity:1}100%{opacity:0}}
.qd-shake{animation:qd-shake .8s cubic-bezier(.36,.07,.19,.97) both}
@keyframes qd-shake{10%,90%{transform:translate(-3px,2px)}20%,80%{transform:translate(6px,-4px)}30%,50%,70%{transform:translate(-12px,6px) rotate(-.6deg)}40%,60%{transform:translate(12px,-6px) rotate(.6deg)}}
@media (prefers-reduced-motion:reduce){#qd-btn,#qd-ov,#qd-num{animation:none!important}.qd-shake{animation:none}#qd-flash.go{animation-duration:.3s}}
</style>

<button id="qd-btn" type="button" aria-label="Autodestrucción (es solo una animación)">☠<br>NO<br>PULSAR</button>

<script>
(function(){
  var btn=document.getElementById("qd-btn"),running=false,timers=[],raf=0,ac=null;
  var reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  function later(fn,ms){timers.push(setTimeout(fn,ms))}
  function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}return ac}
  function beep(f,d){var a=audio();if(!a)return;try{var o=a.createOscillator(),g=a.createGain();o.type="square";o.frequency.value=f;g.gain.value=.06;
    g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
  function boomSound(){var a=audio();if(!a)return;try{var n=a.sampleRate*1.4,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);
    var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="lowpass";f.frequency.value=700;g.gain.value=.5;
    s.connect(f);f.connect(g);g.connect(a.destination);s.start()}catch(e){}}

  function explosion(cv){
    var ctx=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight,cx=W/2,cy=H/2,ps=[],rings=[0,10,22],t0=performance.now();
    var cols=["#fff6b0","#ffd23f","#ff9a1f","#ff4d1f","#c81414"];
    for(var i=0;i<(reduce?40:190);i++){var a=Math.random()*6.283,v=2+Math.random()*13;
      ps.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*5,l:1,c:cols[i%5],dl:.008+Math.random()*.014})}
    (function step(){
      var t=(performance.now()-t0)/1000;ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation="lighter";
      rings.forEach(function(o,i){var r=Math.max(0,(t*1000-o*20)*(1.1+i*.25)),al=Math.max(0,1-r/(Math.max(W,H)*.75));
        if(r>0&&al>0){ctx.beginPath();ctx.arc(cx,cy,r,0,6.283);ctx.lineWidth=14-i*3;ctx.strokeStyle="rgba(255,"+(170-i*40)+",60,"+al+")";ctx.stroke()}});
      var g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(0,260-t*220));g.addColorStop(0,"rgba(255,240,180,"+Math.max(0,.9-t)+")");g.addColorStop(1,"rgba(255,80,0,0)");
      ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ps.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.vx*=.985;p.l-=p.dl;
        if(p.l>0){ctx.globalAlpha=p.l;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.l+.5,0,6.283);ctx.fill()}});
      ctx.globalAlpha=1;
      if(t<2.6)raf=requestAnimationFrame(step);else ctx.clearRect(0,0,W,H);
    })();
  }

  function stop(ov,target){
    timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);
    if(target)target.classList.remove("qd-shake");
    if(ov&&ov.parentNode)ov.parentNode.removeChild(ov);
    btn.style.display="";running=false;
  }

  btn.addEventListener("click",function(){
    if(running)return;running=true;btn.style.display="none";audio();
    var target=document.querySelector("main")||document.body;
    var ov=document.createElement("div");ov.id="qd-ov";
    ov.innerHTML='<canvas></canvas><div id="qd-t1">⚠ AUTODESTRUCCIÓN EN ⚠</div><div id="qd-num">5</div><div id="qd-msg"></div><div id="qd-sub"></div>'
      +'<button id="qd-cancel" type="button">CANCELAR</button><div id="qd-flash"></div>';
    document.documentElement.appendChild(ov);
    var num=ov.querySelector("#qd-num"),msg=ov.querySelector("#qd-msg"),sub=ov.querySelector("#qd-sub"),t1=ov.querySelector("#qd-t1"),fl=ov.querySelector("#qd-flash");
    ov.querySelector("#qd-cancel").onclick=function(){stop(ov,target)};
    document.addEventListener("keydown",function esc(e){if(e.key==="Escape"){document.removeEventListener("keydown",esc);stop(ov,target)}});
    beep(520,.18);
    [4,3,2,1].forEach(function(n,i){later(function(){num.textContent=n;num.style.animation="none";void num.offsetWidth;num.style.animation="";beep(520+(5-n)*90,.18)},(i+1)*1000)});
    later(function(){ // ¡BOOM!
      ov.classList.add("boom");t1.style.display="none";num.style.display="none";ov.querySelector("#qd-cancel").style.display="none";
      fl.classList.add("go");boomSound();explosion(ov.querySelector("canvas"));
      if(!reduce)target.classList.add("qd-shake");
      msg.textContent="💥 ¡BOOOM! 💥";
    },5000);
    later(function(){msg.textContent="…era broma 😈";sub.textContent="El Quedaneitor sigue intacto. Vuestros planes también.";target.classList.remove("qd-shake")},6700);
    later(function(){stop(ov,target)},9000);
  });
})();
</script>
